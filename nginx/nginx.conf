events {
    worker_connections 1024;
}

http {
    # DEVSECOPS: Rate Limiting (Maksimal 5 request per detik dari 1 IP)
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;

    # Menyembunyikan versi Nginx di header (Security by Obscurity dasar)
    server_tokens off;

    server {
        listen 80;
        
        # Arahkan trafik web utama ke container frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
        }

        # Arahkan trafik API ke container backend dengan pengamanan Rate Limiting
        location /api/ {
            limit_req zone=mylimit burst=10 nodelay;
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}