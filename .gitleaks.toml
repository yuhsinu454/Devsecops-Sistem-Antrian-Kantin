title = "Konfigurasi Gitleaks Sistem Antrean Kantin"

[extend]
useDefault = true

[[rules]]
id = "hardcoded-db-password"
description = "Deteksi Hardcoded Password pada Docker Compose atau Konfigurasi"
regex = '''(?i)(MYSQL_ROOT_PASSWORD|MYSQL_PASSWORD|DB_PASSWORD|JWT_SECRET)\s*[:=]\s*['"]?([A-Za-z0-9!@#$%^&*()_+=-]{6,})['"]?'''
secretGroup = 2

[allowlist]
description = "Mengabaikan file template .env.example"
paths = [
  '''\.env\.example$'''
]