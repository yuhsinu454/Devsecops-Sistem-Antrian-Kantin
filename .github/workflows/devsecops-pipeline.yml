name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Software Composition Analysis (SCA) - Fail-Fast Aktif
  sca-backend:
    name: Dependency Security Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Audit (Fail-Fast)
        run: |
          cd backend
          npm ci || npm install --package-lock-only
          # Tanpa '|| true' agar pipeline otomatis GAGAL jika ada celah High/Critical
          npm audit --audit-level=high

  # 2. Static Application Security Testing (SAST)
  sast-scan:
    name: Static Code Analysis (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/nodejs"

  # 3. Secrets Detection (Gitleaks) - Fail-Fast Aktif
  secrets-scan:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" --no-git --verbose

  # 4. Infrastructure as Code (IaC) Security (Checkov) - Fail-Fast Aktif
  iac-scan:
    name: IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          soft_fail: false # Fail-Fast: berhenti jika ada misconfiguration IaC

  # 5. Container Image Security Scanning (Trivy) - Fail-Fast Aktif
  container-scan:
    name: Docker Image Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t kantin-backend:local ./backend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kantin-backend:local'
          format: 'table'
          exit-code: '1' # Fail-Fast: berhenti jika ditemukan celah HIGH/CRITICAL
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'